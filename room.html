<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InterviewPilot — Live Interview</title>
<style>
  :root { --bg:#0f1220; --panel:#181c2f; --text:#e8eaf6; --muted:#9aa0c0; --accent:#6c7cff; --ok:#3ecf8e; --warn:#ff7a6c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid #262b45; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  .pill { font-size:13px; padding:5px 11px; border-radius:99px; background:#262b45; color:var(--muted); }
  .pill.live { background:rgba(62,207,142,.15); color:var(--ok); }
  main { display:grid; grid-template-columns: 1.3fr 1fr; gap:18px; padding:18px 22px; height:calc(100vh - 58px); }
  .stage { position:relative; background:radial-gradient(ellipse at 50% 110%, #3a2f52 0%, transparent 60%), linear-gradient(180deg,#1d2445 0%,#2b3466 55%,#1a1f3a 100%); border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .stage .name { position:absolute; left:16px; bottom:14px; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:10px; font-size:14px; }
  #me { position:absolute; right:14px; bottom:14px; width:200px; aspect-ratio:4/3; object-fit:cover; border-radius:12px; border:2px solid #2f3660; background:#000; transform:scaleX(-1); }
  #avatar { width:min(70%, 420px); height:auto; }
  .side { display:flex; flex-direction:column; gap:12px; min-height:0; }
  #log { flex:1; overflow:auto; background:var(--panel); border-radius:14px; padding:14px; font-size:15px; line-height:1.45; }
  .msg { margin:0 0 12px; }
  .msg b { color:var(--accent); font-weight:600; }
  .msg.me b { color:var(--ok); }
  #live { color:var(--muted); font-style:italic; min-height:22px; font-size:14px; }
  .row { display:flex; gap:8px; }
  input { flex:1; background:var(--panel); border:1px solid #2f3660; color:var(--text); padding:11px 12px; border-radius:10px; font-size:15px; }
  button { background:var(--accent); color:#fff; border:0; padding:11px 16px; border-radius:10px; font-size:15px; cursor:pointer; }
  button.secondary { background:#2f3660; }
  button.danger { background:var(--warn); }
  button:disabled { opacity:.5; cursor:default; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(15,18,32,.88); z-index:5; text-align:center; padding:20px; }
  #start p { color:var(--muted); max-width:420px; margin:0; }
  #card { white-space:pre-wrap; }
  /* avatar animation */
  .stage::before { content:""; position:absolute; inset:8% 12% auto auto; width:38%; height:46%; border-radius:12px;
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02)); box-shadow:inset 0 0 0 2px rgba(255,255,255,.05); filter:blur(1px); }
  .stage::after { content:""; position:absolute; left:50%; top:50%; width:58%; aspect-ratio:1; transform:translate(-50%,-55%);
    border-radius:50%; background:radial-gradient(circle, rgba(108,124,255,.0) 55%, rgba(108,124,255,.35) 70%, transparent 72%);
    opacity:0; transition:opacity .4s; pointer-events:none; }
  .talking::after { opacity:1; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:translate(-50%,-55%) scale(1)} 50%{transform:translate(-50%,-55%) scale(1.04)} }
  #avatar { filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)); position:relative; z-index:1; }
  #bodyg { transform-origin:200px 520px; animation:breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.012) translateY(-1px)} }
  #idle { transform-origin:200px 330px; animation:sway 7s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(0)} 30%{transform:rotate(1.2deg)} 70%{transform:rotate(-1deg) translateY(1px)} }
  #brows { transition:transform .25s ease; }
  .talking #brows { animation:brow 2.2s ease-in-out infinite; }
  @keyframes brow { 0%,100%{transform:translateY(0)} 20%{transform:translateY(-3px)} 45%{transform:translateY(0)} 75%{transform:translateY(-2px)} }
  .earring { transform-box:fill-box; transform-origin:50% 0; animation:swing 3s ease-in-out infinite; }
  @keyframes swing { 0%,100%{transform:rotate(6deg)} 50%{transform:rotate(-6deg)} }
  #head { transform-origin:200px 330px; transition:transform .5s ease; }
  .talking #head { animation:talk 2.6s ease-in-out infinite; }
  .listening #head { animation:nod 3.2s ease-in-out infinite; }
  @keyframes talk { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-2deg) translateY(-2px)} 60%{transform:rotate(1.8deg)} }
  @keyframes nod { 0%,100%{transform:rotate(0)} 40%{transform:rotate(0) translateY(3px)} 50%{transform:translateY(0)} }
  #lids { transform-origin:200px 186px; transform:scaleY(0); transition:transform .06s; }
  .blink #lids { transform:scaleY(1); }
  #hand { transform-origin:300px 470px; transition:transform .6s ease; }
  .talking #hand { animation:gesture 3.4s ease-in-out infinite; }
  @keyframes gesture { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-9deg) translateY(-6px)} 65%{transform:rotate(4deg)} }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } .stage { height:60vh; } #log { height:40vh; } }
</style>
</head>

<script>
const sid = location.pathname.split("/").filter(Boolean).pop();
const api = (p) => `${location.pathname.replace(/\/$/, "")}/${p}`;
const $ = (id) => document.getElementById(id);
const stage = $("stage"), log = $("log"), live = $("live"), statusEl = $("status"), mouth = $("mouth");

let voice = null, speaking = false, busy = false, micOn = true, ended = false;
let rec = null, buffer = "", interimText = "", currentUtterance = "";

function setStatus(t, isLive) { statusEl.textContent = t; statusEl.classList.toggle("live", !!isLive); }
function add(who, text) {
  const p = document.createElement("p");
  p.className = "msg" + (who === "me" ? " me" : "");
  p.innerHTML = `<b>${who === "me" ? "You" : "Priya"}:</b> `;
  p.appendChild(document.createTextNode(text));
  log.appendChild(p); log.scrollTop = log.scrollHeight;
}

function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const prefs = [/female|woman|samantha|zira|aria|jenny|google uk english female|veena|heera|karen|moira|tessa|serena/i];
  voice = vs.find(v => /en-IN/i.test(v.lang) && prefs[0].test(v.name))
       || vs.find(v => /en/i.test(v.lang) && prefs[0].test(v.name))
       || vs.find(v => /en-IN/i.test(v.lang)) || vs.find(v => /en/i.test(v.lang)) || vs[0];
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

const SMILE = "M-20 -1 Q0 8 20 -1 Q0 11 -20 -1 Z";
const OPEN = [SMILE, "M-22 -2 Q0 4 22 -2 Q0 16 -22 -2 Z", "M-20 -3 Q0 2 20 -3 Q0 22 -20 -3 Z", "M-16 -2 Q0 1 16 -2 Q0 14 -16 -2 Z"];
let mouthTimer = null;
function mouthAnim(on) {
  clearInterval(mouthTimer);
  if (!on) { mouth.setAttribute("d", SMILE); return; }
  mouthTimer = setInterval(() => mouth.setAttribute("d", OPEN[1 + Math.floor(Math.random() * 3)]), 110);
}
function mode(m) { stage.classList.toggle("talking", m === "talk"); stage.classList.toggle("listening", m === "listen"); }

let uttSeq = 0, lastLine = "";
function speak(text) {
  return new Promise((resolve) => {
    const id = ++uttSeq;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 1.0; u.pitch = 1.08;
    currentUtterance = lastLine + " " + text.toLowerCase(); lastLine = text.toLowerCase();
    u.onboundary = () => mouth.setAttribute("d", OPEN[1 + Math.floor(Math.random() * 3)]);
    u.onstart = () => { if (id !== uttSeq) return; speaking = true; mode("talk"); mouthAnim(true); setStatus("Priya is speaking", true); };
    const done = () => { if (id === uttSeq) { speaking = false; mouthAnim(false); mode("listen"); setStatus("Listening…", true); } resolve(); };
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  });
}

function bargeIn() {
  if (speaking) { speechSynthesis.cancel(); speaking = false; mouthAnim(false); mode("listen"); setStatus("Listening…", true); }
}

function looksLikeEcho(t) {
  const words = t.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const said = new Set(currentUtterance.replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean));
  const hits = words.map(w => w.replace(/[^a-z0-9']/g, "")).filter(w => said.has(w)).length;
  return hits / words.length > 0.7;
}

const ACKS = ["Okay.", "Got it.", "Mm-hmm, right.", "Okay, that makes sense.", "Interesting.", "Alright.", "I see."];
let queued = "";
async function send(text) {
  text = text.trim();
  if (!text || ended) return;
  if (busy) { queued = (queued + " " + text).trim(); add("me", text); return; }
  add("me", text); busy = true; setStatus("Priya is thinking…", true);
  const pending = fetch(api("turn"), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ text }) });
  speak(ACKS[Math.floor(Math.random() * ACKS.length)]);
  try {
    const r = await pending;
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    busy = false;
    if (queued && !j.end) { add("hr", j.reply); const more = queued; queued = ""; return send(more); }
    add("hr", j.reply); await speak(j.reply);
    if (j.end) end(true);
  } catch (e) {
    busy = false; setStatus("Connection issue — try again", false);
    add("hr", "Sorry, I lost you for a second. Could you say that again?");
  }
}

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { live.textContent = "Voice input isn't supported in this browser — type your answers below."; return; }
  rec = new SR(); rec.lang = "en-IN"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) { if (!looksLikeEcho(t)) { bargeIn(); buffer += " " + t.trim(); } }
      else interim += t;
    }
    interimText = interim;
    const heard = (buffer + " " + interim).trim();
    if (speaking && interim.trim() && !looksLikeEcho(interim)) bargeIn();
    if (looksLikeEcho(interim)) interim = "";
    live.textContent = heard ? "🗣️ " + heard : "";
    if (!interim && buffer.trim()) { const t = buffer.trim(); buffer = ""; interimText = ""; live.textContent = ""; send(t); }
  };
  rec.onstart = () => { if (!speaking) setStatus("Listening…", true); };
  rec.onend = () => { if (micOn && !ended) { try { rec.start(); } catch (_) {} } };
  rec.onerror = (e) => { if (e.error === "not-allowed") live.textContent = "Mic blocked — allow microphone access or type below."; };
  try { rec.start(); } catch (_) {}
}

async function join() {
  $("start").style.display = "none";
  startRecognition();
  try { $("me").srcObject = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); } catch (_) { $("me").style.display = "none"; }
  const s = await (await fetch(api("state"))).json();
  s.turns.forEach(t => add(t.who === "hr" ? "hr" : "me", t.text));
  if (s.done) { ended = true; try { rec && rec.stop(); } catch (_) {} setStatus("Interview finished"); return; }
  const last = s.turns[s.turns.length - 1];
  if (last && last.who === "hr") await speak(last.text);
}

async function end(byPriya) {
  if (ended) return;
  ended = true; micOn = false; try { rec && rec.stop(); } catch (_) {}
  speechSynthesis.cancel(); mouthAnim(false); mode(""); setStatus("Ending interview…", true);
  ["send", "mic", "end"].forEach(id => $(id).disabled = true);
  if (byPriya !== true) await speak("Thank you so much for your time today. Your feedback will be in your chat shortly.");
  try {
    const r = await fetch(api("end"), { method:"POST" });
    if (!r.ok) throw new Error(r.status);
    add("hr", "Interview ended. Your scorecard has been sent to your ASI:One chat.");
    setStatus("Interview ended. Check your ASI:One chat", false);
  } catch (_) { setStatus("Interview ended. Your scorecard will appear in your ASI:One chat", false); }
}

let joined = false;
window.addEventListener("pagehide", () => { if (joined && !ended) navigator.sendBeacon(api("left")); });
$("go").onclick = () => { joined = true; join(); };
$("end").onclick = () => end(false);
$("send").onclick = () => { const t = $("text").value; $("text").value = ""; bargeIn(); send(t); };
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
$("mic").onclick = () => {
  micOn = !micOn; $("mic").textContent = micOn ? "🎤 Mic on" : "🔇 Mic off";
  if (micOn) { try { rec && rec.start(); } catch (_) {} } else { try { rec && rec.stop(); } catch (_) {} }
};
function blink() {
  stage.classList.add("blink"); setTimeout(() => stage.classList.remove("blink"), 130);
  if (Math.random() < .2) setTimeout(() => { stage.classList.add("blink"); setTimeout(() => stage.classList.remove("blink"), 120); }, 260);
  setTimeout(blink, 2200 + Math.random() * 3800);
}
setTimeout(blink, 1500);
setInterval(() => {
  if (speaking) return;
  const dx = (Math.random() - .5) * 5, dy = (Math.random() - .5) * 2.5;
  $("eyes").setAttribute("transform", `translate(${dx} ${dy})`);
}, 1800);
document.addEventListener("mousemove", (e) => {
  const dx = (e.clientX / innerWidth - .5) * 4, dy = (e.clientY / innerHeight - .5) * 3;
  $("pl").setAttribute("cx", 168 + dx); $("pr").setAttribute("cx", 232 + dx);
  $("pl").setAttribute("cy", 198 + dy); $("pr").setAttribute("cy", 198 + dy);
});
</script>
</body>
